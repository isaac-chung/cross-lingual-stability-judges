[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cross-lingual-stability-judges"
version = "0.1.0"
description = "Cross-lingual stability evaluation for LLM judges"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
notebook = [
    "marimo>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conversation_generator", "src/conversation_parser", "src/llm_judge", "src/label_recovery"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
